{% extends "base.html" %}
{% load i18n allauth %}

{% block head_title %}
    {% trans "Change Password" %}
{% endblock head_title %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6 text-center">

        <!-- Success Icon -->
        <div class="flex justify-center">
            <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 12l2 2 4-4" />
                <circle cx="12" cy="12" r="10" />
            </svg>
        </div>

        <!-- Title -->
        <h1 class="text-2xl font-extrabold text-gray-800">
            {% trans "Password Changed" %}
        </h1>

        <!-- Confirmation Message -->
        <p class="text-gray-600">
            {% trans "Your password has been successfully changed." %}
        </p>

        <!-- Optional: Back to login -->
        <a href="{% url 'account_login' %}" 
           class="inline-flex items-center justify-center mt-4 w-full px-4 py-3 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            {% trans "Sign In" %}
        </a>

    </div>
</div>
{% endblock content %}
