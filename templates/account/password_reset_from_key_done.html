{% extends "base.html" %}
{% load i18n allauth %}

{% block head_title %}
    {% trans "Change Password" %}
{% endblock head_title %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-8">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6 text-center">

        <!-- Title -->
        <h1 class="text-2xl font-extrabold text-gray-800">
            {% trans "Change Password" %}
        </h1>

        <!-- Confirmation Message -->
        <p class="text-gray-600">
            {% trans "Your password has been successfully changed." %}
        </p>

        <!-- Optional: Back to dashboard / login -->
        <a href="{% url 'account_login' %}" 
           class="inline-block mt-4 px-6 py-3 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition">
            {% trans "Sign In" %}
        </a>

    </div>
</div>
{% endblock content %}
