{% extends "base.html" %}
{% load i18n %}
{% load allauth %}

{% block head_title %}
    {% translate "Account Inactive" %}
{% endblock head_title %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center">
        <!-- Icon -->
        <div class="flex justify-center mb-6">
            <svg class="w-16 h-16 text-red-600" fill="currentColor" viewBox="0 0 24 24">
                <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10
                10-4.477 10-10S17.523 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V6h2v6z" clip-rule="evenodd"/>
            </svg>
        </div>

        <!-- Title -->
        <h1 class="text-3xl font-extrabold text-gray-800 mb-4">
            {% translate "Account Inactive" %}
        </h1>

        <!-- Message -->
        <p class="text-gray-600">
            {% translate "This account is inactive." %}
        </p>
    </div>
</div>
{% endblock content %}
