{% load i18n %}
{% load account %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta content="telephone=no" name="format-detection" />
  <title>
    {% block head_title %}
    {% trans "Email from MYAUTHALL" %}
    {% endblock %}
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Jost&display=swap" rel="stylesheet" />
 <style type="text/css">
  .rollover:hover .rollover-first { max-height: 0px !important; display: none !important; }
  .rollover:hover .rollover-second { max-height: none !important; display: block !important; }
  .rollover span { font-size: 0px; }
  u + .body img ~ div div { display: none; }
  #outlook a { padding: 0; }
  span.MsoHyperlink, span.MsoHyperlinkFollowed { color: inherit; mso-style-priority: 99; }
  a.es-button { mso-style-priority: 100 !important; text-decoration: none !important; }
  a[x-apple-data-detectors], #MessageViewBody a {
    color: inherit !important;
    text-decoration: none !important;
    font-size: inherit !important;
    font-family: inherit !important;
    font-weight: inherit !important;
    line-height: inherit !important;
  }
  .es-desk-hidden { display: none; float: left; overflow: hidden; width: 0; max-height: 0; line-height: 0; mso-hide: all; }
  @media only screen and (max-width: 600px) {
    .es-m-p0r { padding-right: 0px !important; }
    .es-m-p20b { padding-bottom: 20px !important; }
    .es-m-p40r { padding-right: 40px !important; }
    .es-m-p40b { padding-bottom: 40px !important; }
    .es-m-p20t { padding-top: 20px !important; }
    .es-m-p20r { padding-right: 20px !important; }
    .es-m-p20l { padding-left: 20px !important; }
    *[class="gmail-fix"] { display: none !important; }
    p, a { line-height: 150% !important; }
    h1, h1 a { line-height: 120% !important; font-size: 30px !important; text-align: left; }
    h2, h2 a { line-height: 120% !important; font-size: 24px !important; text-align: left; }
    h3, h3 a { line-height: 120% !important; font-size: 20px !important; text-align: left; }
    h4, h4 a { line-height: 120% !important; font-size: 24px !important; text-align: left; }
    h5, h5 a { line-height: 120% !important; font-size: 20px !important; text-align: left; }
    h6, h6 a { line-height: 120% !important; font-size: 16px !important; text-align: left; }
    .es-header-body p, .es-content-body p, .es-footer-body p, .es-infoblock p { font-size: 14px !important; }
    .es-m-txt-c, .es-m-txt-c h1, .es-m-txt-c h2, .es-m-txt-c h3, .es-m-txt-c h4, .es-m-txt-c h5, .es-m-txt-c h6 { text-align: center !important; }
    .es-m-txt-r, .es-m-txt-r h1, .es-m-txt-r h2, .es-m-txt-r h3, .es-m-txt-r h4, .es-m-txt-r h5, .es-m-txt-r h6 { text-align: right !important; }
    .es-m-txt-j, .es-m-txt-j h1, .es-m-txt-j h2, .es-m-txt-j h3, .es-m-txt-j h4, .es-m-txt-j h5, .es-m-txt-j h6 { text-align: justify !important; }
    .es-m-txt-l, .es-m-txt-l h1, .es-m-txt-l h2, .es-m-txt-l h3, .es-m-txt-l h4, .es-m-txt-l h5, .es-m-txt-l h6 { text-align: left !important; }
    .es-m-txt-r img, .es-m-txt-c img, .es-m-txt-l img { display: inline !important; }
    .es-m-txt-r .rollover:hover .rollover-second, .es-m-txt-c .rollover:hover .rollover-second, .es-m-txt-l .rollover:hover .rollover-second { display: inline !important; }
    .es-m-txt-r .rollover span, .es-m-txt-c .rollover span, .es-m-txt-l .rollover span { line-height: 0 !important; font-size: 0 !important; display: block; }
    .es-spacer { display: inline-table; }
    a.es-button, button.es-button { font-size: 18px !important; padding: 10px 20px !important; line-height: 120% !important; display: inline-block !important; }
    .es-m-fw, .es-m-fw.es-fw, .es-m-fw .es-button { display: block !important; }
    .es-m-il, .es-m-il .es-button, .es-social, .es-social td, .es-menu.es-table-not-adapt { display: inline-block !important; }
    .es-adaptive table, .es-left, .es-right { width: 100% !important; }
    .es-content table, .es-header table, .es-footer table, .es-content, .es-footer, .es-header { width: 100% !important; max-width: 600px !important; }
    .adapt-img { width: 100% !important; height: auto !important; }
    .es-adapt-td { display: block !important; width: 100% !important; }
    .es-mobile-hidden, .es-hidden { display: none !important; }
    .es-container-hidden { display: none !important; }
    .es-desk-hidden { width: auto !important; overflow: visible !important; float: none !important; max-height: inherit !important; line-height: inherit !important; }
    tr.es-desk-hidden { display: table-row !important; }
    table.es-desk-hidden { display: table !important; }
    td.es-desk-menu-hidden { display: table-cell !important; }
    .es-menu td { width: 1% !important; }
    table.es-table-not-adapt, .esd-block-html table { width: auto !important; }
    .h-auto { height: auto !important; }
  }
  @media screen and (max-width: 384px) {
    .mail-message-content { width: 414px !important; }
  }
</style>
</head>
<body class="body" style="width: 100%; height: 100%; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; padding: 0; margin: 0;">
  <div dir="ltr" class="es-wrapper-color" lang="en" style="background-color: #f6f6f6">
    <table width="100%" cellspacing="0" cellpadding="0" class="es-wrapper" role="none">
      <tr>
        <td valign="top" style="padding: 0; margin: 0">
          <!-- Header -->
          <table cellspacing="0" cellpadding="0" align="center" class="es-header" role="none">
            <tr>
              <td align="center" style="padding: 0; margin: 0">
                <table cellspacing="0" cellpadding="0" bgcolor="#D4D9FA" align="center" class="es-header-body" style="background-color: #d4d9fa; width: 600px;">
                  <tr>
                    <td align="left" style="padding: 35px 20px 30px 20px;">
                      <table cellspacing="0" cellpadding="0" align="left" class="es-left" style="float: left;">
                        <tr>
                          <td align="center" style="width: 324px">
                            <table width="100%" role="presentation">
                              <tr>
                                <td align="left" style="font-size: 0px;">
                                  <a target="_blank" href="{{ site_url }}" style="color: #020202; font-size: 14px;">
                                    <img src="https://fvanesf.stripocdn.email/content/guids/CABINET_1159641deaa3ad69b7f0b38d019e004ba58474ba8d869c4917936476e9a86b2d/images/translation_agency_e2U.png" alt="MYAUTHALL Logo" height="55" style="display: block; border: 0;" width="164" />
                                  </a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                      <table cellspacing="0" cellpadding="0" align="right" class="es-right" style="float: right;">
                        <tr>
                          <td align="left" style="width: 216px">
                            <table width="100%" role="presentation">
                              <tr>
                                <td align="right">
                                  <h2 style="font-family: Jost, Arial, sans-serif; font-size: 24px; color: #020202;">
                                    {% trans "Email Message" %}
                                  </h2>
                                </td>
                              </tr>
                              <tr>
                                <td align="right" style="padding-top: 5px;">
                                  <p style="font-family: Jost, Arial, sans-serif; line-height: 21px; color: #020202; font-size: 14px;">
                                    {{ current_date }}
                                  </p>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td align="left" style="padding: 0 20px;">
                      <table width="100%" role="none">
                        <tr>
                          <td align="center" style="width: 560px">
                            <table width="100%" role="presentation">
                              <tr>
                                <td style="padding: 5px 0; font-size: 0;">
                                  <table width="100%" role="presentation">
                                    <tr>
                                      <td style="border-bottom: 1px solid #3a0bc7; height: 0px;"></td>
                                    </tr>
                                  </table>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <!-- Content -->
          {% block content %}{% endblock %}
          <!-- Footer -->
          <table cellpadding="0" cellspacing="0" align="center" class="es-footer" role="none">
            <tr>
              <td align="center" style="padding: 0; margin: 0">
                <table cellspacing="0" cellpadding="0" bgcolor="#ffffff" align="center" class="es-footer-body" style="background: linear-gradient(135deg, #5b3dc4, #8666e6, #b597f9); width: 600px;">
                  <tr>
                    <td align="left" style="padding: 30px 20px;">
                      <table width="100%" role="none">
                        <tr>
                          <td align="left" style="width: 560px">
                            <table width="100%" role="presentation">
                              <tr>
                                <td align="center">
                                  <p style="font-family: Jost, Arial, sans-serif; line-height: 21px; color: #fffdf7; font-size: 14px;">
                                    <em>
                                      {% blocktrans %}
                                      Thank you for using <a href="{{ site_url }}" style="color: #fffdf7; font-size: 14px;">{{ site_name }}</a>.
                                      {% endblocktrans %}
                                    </em>
                                  </p>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
