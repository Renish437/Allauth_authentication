{% extends "base.html" %}
{% load i18n allauth %}

{% block head_title %}
    OpenID {% trans "Sign In" %}
{% endblock head_title %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-6 space-y-6">

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-800">
        OpenID {% trans "Sign In" %}
    </h1>

    <!-- Form -->
    {% url 'openid_login' as action_url %}
    <form method="post" action="{{ action_url }}" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="w-full px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">
            {% trans "Sign In" %}
        </button>
    </form>

</div>
{% endblock content %}
